<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>VAgent HQ · Office</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#FAF9F5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/office.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="logo">
        <img class="mark" src="/logo.png" alt="VAgent" width="32" height="32">
        <span class="name">VAgent HQ</span>
        <span class="live" title="Live from n8n"><span class="dot" id="live-dot"></span><span id="live-text">Connecting…</span></span>
      </div>
      <div class="actions">
        <button class="btn primary" type="button" id="btn-task" aria-label="Talk to the CEO">
          <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
          <span>Talk to the CEO</span>
        </button>
        <button class="btn icon" type="button" id="btn-clients" aria-label="Client accounts" style="display:none">👤</button>
        <button class="btn icon" type="button" id="btn-settings" aria-label="Settings">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
        <a class="btn" href="/api/logout" aria-label="Sign out" style="gap:6px;font-size:13px">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Log out
        </a>
      </div>
    </header>

    <aside class="side" aria-label="Agents">
      <div id="notice"></div>
      <div class="filters" role="group" aria-label="Show">
        <button type="button" data-f="all" aria-pressed="true">All <b id="n-all">0</b></button>
        <button type="button" data-f="working" aria-pressed="false"><i class="sd working"></i>Working <b id="n-working">0</b></button>
        <button type="button" data-f="cafe" aria-pressed="false"><i class="sd idle"></i>Resting <b id="n-idle">0</b></button>
        <button type="button" data-f="help" aria-pressed="false"><i class="sd help"></i>Help <b id="n-help">0</b></button>
        <button type="button" data-f="off" aria-pressed="false"><i class="sd off"></i>Off <b id="n-off">0</b></button>
      </div>
      <select id="inst" class="input" aria-label="Whose agents" hidden></select>
      <label class="search"><span class="sr">Search agents</span><input id="q" type="search" placeholder="Search agents  ( / )" autocomplete="off"></label>
      <div id="depts" class="depts"></div>
      <div id="list" class="list"></div>
      <div class="owners" id="owners"></div>
      <details class="activity">
        <summary>Recent activity</summary>
        <ol id="feed"></ol>
      </details>
    </aside>

    <main class="stage" id="stage" aria-label="Office. Scroll or pinch to zoom, drag to move."></main>

    <div class="scrim" id="scrim" hidden></div>
    <aside class="drawer" id="drawer" aria-hidden="true" aria-label="Details">
      <button class="close" type="button" id="drawer-close" aria-label="Close">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="drawer-in" id="drawer-in"></div>
    </aside>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script>
    // Apply role-based layout before office.js runs by intercepting /api/office
    const _f = window.fetch.bind(window);
    window.fetch = async (...a) => {
      const r = await _f(...a);
      if (String(a[0]).endsWith('/api/office') || String(a[0]).includes('/api/office?')) {
        const clone = r.clone();
        clone.json().then(j => {
          if (j.role) { document.body.dataset.role = j.role; }
        }).catch(() => {});
      }
      return r;
    };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="/assets/scene.js"></script>
  <script src="/assets/building.js"></script>
  <script src="/assets/office.js"></script>
  <script src="/assets/nozoom.js"></script>
</body>
</html>
