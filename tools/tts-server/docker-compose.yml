# Self-hosted VoiceStudio (OmniVoice) TTS for the Voice Receptionist. Source: https://github.com/debpalash/VoiceStudio (AGPL-3.0)
# voicestudio = the API + web UI on port 3900. Only reachable from this server (127.0.0.1) and from the tunnel below.
#               Requests from anywhere else must carry  Authorization: Bearer $OMNIVOICE_API_KEY  (built into VoiceStudio).
# tunnel      = Cloudflare Tunnel, so the n8n VPS can reach it with no open router port. In the tunnel's "public hostname"
#               settings point the service at  http://voicestudio:3900
# CPU image. First start downloads ~2.4 GB of model weights from Hugging Face (watch: docker logs -f omnivoice).
services:
  voicestudio:
    image: palashdeb/omnivoice-studio:stable
    container_name: omnivoice
    restart: unless-stopped
    ports: ["127.0.0.1:3900:3900"]
    environment:
      - OMNIVOICE_API_KEY
      - OMNIVOICE_DATA_DIR=/app/omnivoice_data
      - OMNIVOICE_ANALYTICS_DISABLED=1
    volumes: ["omnivoice-data:/app/omnivoice_data"]
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment: [TUNNEL_TOKEN]
    depends_on: [voicestudio]
volumes:
  omnivoice-data:
