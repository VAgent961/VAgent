<!doctype html><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#141413;color:#FAF9F5;font-family:Inter,sans-serif;position:relative}
.a{position:absolute}.full{position:absolute;inset:0}
.blob{position:absolute;width:1100px;height:1100px;border-radius:50%}
#grid{position:absolute;inset:-120px;background-image:radial-gradient(rgba(250,249,245,.09) 2px,transparent 3px);background-size:60px 60px}
#cam{transform-origin:540px 900px}
#girl{position:absolute;z-index:1;left:0;top:0;width:400px;height:470px;transform-origin:0 0;filter:drop-shadow(0 18px 30px rgba(0,0,0,.35))}
#eyebrow{left:0;right:0;top:218px;display:flex;justify-content:center}
#eyebrow span{font:700 27px Inter;letter-spacing:5px;text-transform:uppercase;color:#F2B7A2;border:2px solid rgba(217,119,87,.55);background:rgba(181,83,47,.2);border-radius:40px;padding:10px 28px}
#title{position:absolute;left:70px;right:70px;top:282px;height:180px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;column-gap:.24em;text-align:center;font:600 90px/1.02 Newsreader,serif;text-shadow:0 6px 30px rgba(0,0,0,.55)}
#title b{font-weight:600;display:inline-block;overflow:hidden;padding:0 4px .1em;margin-bottom:-.08em}
#title i{font-style:normal;display:inline-block}
#mark{left:64px;top:84px;width:250px}
#ai{right:64px;top:103px;font:600 25px Inter;color:#CFC9BC;border:2px solid rgba(250,249,245,.18);border-radius:30px;padding:8px 20px}
#bar{left:64px;right:64px;top:48px;height:8px;display:flex;gap:10px}
#bar div{height:8px;border-radius:4px;background:rgba(250,249,245,.2);overflow:hidden}
#bar i{display:block;height:100%;background:#D97757;transform-origin:0 50%}
#cap{position:absolute;z-index:3;left:80px;right:80px;top:1448px;height:190px;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:10px 8px}
#cap span{font:800 60px/1.15 Inter,sans-serif;padding:4px 14px;border-radius:18px;color:#FFFDF8;text-shadow:0 3px 6px rgba(0,0,0,.8),0 6px 26px rgba(0,0,0,.8)}
#shade{background:radial-gradient(ellipse 80% 62% at 50% 46%,transparent 55%,rgba(0,0,0,.55)),linear-gradient(transparent 68%,rgba(10,9,8,.6) 80%,rgba(10,9,8,.35))}
.tile{position:absolute;border-radius:34px;border:2px solid rgba(250,249,245,.1);background:linear-gradient(140deg,rgba(250,249,245,.09),rgba(250,249,245,.02))}
.dock{position:absolute;left:390px;width:620px;top:1190px;height:168px;border-radius:40px;background:rgba(38,34,31,.92);border:2px solid rgba(250,249,245,.12);box-shadow:0 30px 60px rgba(0,0,0,.45)}
.dock b{position:absolute;left:36px;top:26px;font:700 33px Inter}
.dock small{position:absolute;right:36px;top:31px;font:600 25px Inter;color:#A9A294}
.dock i{position:absolute;bottom:25px;width:13px;height:62px;border-radius:7px;background:#D97757}
.fx{position:absolute;left:0;top:0;width:1080px;height:1920px;image-rendering:pixelated;pointer-events:none}
#fx-front{z-index:2}#fx-cut{z-index:4}#mark,#ai,#bar{z-index:6}
.card{position:absolute;background:#FAF9F5;color:#141413;border-radius:44px;box-shadow:0 40px 80px rgba(0,0,0,.5)}
.ghost{position:absolute;border-radius:44px;background:#F3F1EA;opacity:.14}
.demo{position:absolute;right:34px;top:30px;font:600 24px Inter;color:#8A8478;border:2px solid #DDD8CC;border-radius:30px;padding:4px 18px}
.head{position:absolute;left:40px;top:28px;font:600 40px Newsreader,serif}
.row{position:absolute;left:40px;right:40px;height:104px;border-radius:28px;background:#F3F1EA;display:flex;align-items:center;gap:26px;padding:0 28px;font:600 38px Inter}
.dot{flex:none;width:56px;height:56px;border-radius:50%;background:#DDD8CC;color:#fff;display:flex;align-items:center;justify-content:center;font:800 30px Inter}
.on .dot{background:#B5532F}
.msg{position:absolute;max-width:600px;padding:26px 34px;border-radius:34px;font:500 38px/1.35 Inter;background:#EDEAE1}
.msg.you{right:34px;background:#B5532F;color:#fff;border-bottom-right-radius:8px}.msg.agent{left:34px;border-bottom-left-radius:8px}
.line{position:absolute;height:26px;border-radius:13px;background:#E4E0D5;transform-origin:0 50%}
.pill{position:absolute;border-radius:60px;background:#B5532F;color:#fff;font:800 48px Inter;text-align:center;padding:26px 0}
#lockup{position:absolute;z-index:2;left:340px;top:1150px;width:400px}
#cam .pill{box-shadow:0 24px 44px rgba(0,0,0,.35)}
</style>
<div class="full" id="bg"><div class="blob" id="b1" style="background:radial-gradient(circle,rgba(181,83,47,.55),transparent 65%)"></div><div class="blob" id="b2" style="background:radial-gradient(circle,rgba(224,129,86,.25),transparent 65%)"></div><div id="grid"></div></div>
<div class="full" id="depth"></div><canvas class="fx" id="fx-back"></canvas>
<div class="full" id="shade"></div>
<div class="full" id="cam"><div class="full" id="ui"></div><div class="full" id="dockwrap"></div><div id="girl"></div><img id="lockup"></div>
<div class="a" id="eyebrow"><span></span></div><div id="title"></div><div id="cap"></div>
<canvas class="fx" id="fx-front"></canvas><canvas class="fx" id="fx-cut"></canvas>
<img class="a" id="mark"><div class="a" id="ai">AI character</div><div class="a" id="bar"></div>
<script src="character.js"></script>
<script type="module" src="fx.mjs"></script>
<script>
let D, draw, built = -1;
const $ = (id) => document.getElementById(id);
const clamp = (v) => Math.max(0, Math.min(1, v));
const out = (k) => 1 - Math.pow(1 - clamp(k), 3);

async function setup(d) {

}
// Builds the mockup for one scene and returns its animator(k = seconds since the cut, dur).

    return (k) => chips.forEach((c, i) => { const a = back((k - .5 - i * .45) / .4); c.style.opacity = clamp(a); c.style.transform = `translateY(${Math.sin(k * 2 + i * 2) * 10}px) scale(${a}) rotate(${i % 2 ? 5 : -5}deg)`; });
  }

    const p = el(ui, 'pill', 'left:230px;top:1300px;width:620px', items[0] || 'Message us');

  }

  const card = el(ui, 'card', phone ? 'left:190px;top:505px;width:760px;height:600px' : 'left:100px;top:505px;width:880px;height:600px');
  el(card, 'head', '', { phone: 'Chat', flow: 'Workflow', browser: 'Website', list: 'Shortlist', approve: 'Draft', alert: 'Check' }[shot]);
  el(card, 'demo', '', 'Demo');
  let anim = () => {};
  if (phone) {
    const history = D.scenes.slice(0, n + 1).filter((x) => x.chat).slice(-3);
    let y = 130;
    const msgs = history.map((x) => { const m = el(card, 'msg ' + x.chat[0], `top:${y}px`, x.chat[1]); y += m.offsetHeight + 26; return m; });
    const typing = el(card, 'msg agent', `top:${y}px`, '');

  } else if (shot === 'flow' || shot === 'list') {

      const step = Math.max(.35, (dur - 1) / Math.max(1, items.length));
      rows.forEach(({ r, dot }, i) => { const a = out((k - .25 - i * .14) / .35), done = k > .7 + i * step; r.style.opacity = a; r.style.transform = `translateX(${(1 - a) * 120}px) scale(${done ? 1 + .04 * Math.sin(clamp((k - .7 - i * step) / .3) * Math.PI) : 1})`; r.classList.toggle('on', done); dot.textContent = done ? '✓' : i + 1; });

    el(card, 'a', 'left:40px;right:40px;top:100px;height:3px;background:#E4E0D5');
    const hero = el(card, 'a', 'left:40px;right:40px;top:130px;height:190px;border-radius:30px;background:linear-gradient(120deg,#B5532F,#E08156);color:#fff;font:600 54px Newsreader,serif;display:flex;align-items:center;justify-content:center', items[0] || '');
    const tiles = items.slice(1, 4).map((x, i) => el(card, 'a', `left:${40 + i * 272}px;top:345px;width:256px;height:215px;border-radius:28px;background:#F3F1EA;font:600 32px Inter;display:flex;align-items:flex-end;justify-content:center;padding-bottom:26px`, x));
    const shapes = tiles.map((t) => el(t, 'a', 'left:73px;top:34px;width:110px;height:100px;border-radius:30px;background:#E3C3B4'));
    anim = (k) => { [hero, ...tiles].forEach((n2, i) => { const a = back((k - .3 - i * .4) / .45); n2.style.opacity = clamp(a); n2.style.transform = `translateY(${(1 - a) * 60}px) scale(${.8 + .2 * a})`; }); shapes.forEach((sh, i) => sh.style.transform = `translateY(${Math.sin(k * 2.4 + i) * 6}px)`); };
  } else if (shot === 'approve') {
    const text = el(card, 'a', 'left:50px;right:50px;top:125px;font:500 44px/1.4 Inter', '');
    const bars = [760, 610].map((w, i) => el(card, 'line', `left:50px;top:${320 + i * 50}px;width:${w}px`));
    const yes = el(card, 'pill', 'left:50px;top:445px;width:380px;font-size:40px', 'Approve');
    el(card, 'pill', 'left:460px;top:445px;width:370px;font-size:40px;background:#E4E0D5;color:#141413', 'Edit');
    const cur = el(card, 'a', 'width:54px;height:54px;border-radius:50%;background:rgba(20,20,19,.35);border:6px solid #fff');
    anim = (k, dur) => {
      const full = items[0] || '', press = dur * .68; text.textContent = full.slice(0, Math.floor(clamp((k - .3) / (dur * .4)) * full.length));
      bars.forEach((b, i) => b.style.transform = `scaleX(${out((k - .5 - i * .2) / .6)})`);
      const m = out((k - press + .7) / .7); cur.style.left = 760 - 540 * m + 'px'; cur.style.top = 580 - 100 * m + 'px';
      const hit = k > press; yes.textContent = hit ? 'Approved ✓' : 'Approve'; yes.style.background = hit ? '#2F7D4F' : '#B5532F'; yes.style.transform = `scale(${1 - .09 * Math.sin(clamp((k - press) / .3) * Math.PI)})`;
    };
  } else if (shot === 'alert') {
    const btn = el(card, 'pill', 'left:230px;top:150px;width:420px;background:#E4E0D5;color:#141413', 'Order now');
    const cur = el(card, 'a', 'width:54px;height:54px;border-radius:50%;background:rgba(20,20,19,.35);border:6px solid #fff');
    const warn = el(card, 'a', 'left:50px;right:50px;top:330px;border-radius:32px;background:#FBE4DC;border:4px solid #B5532F;padding:34px 40px;font:600 40px/1.35 Inter', items[0] || '');
    anim = (k) => {
      const m = out((k - .2) / .8); cur.style.left = 780 - 330 * m + 'px'; cur.style.top = 520 - 320 * m + 'px';
      btn.style.transform = `scale(${1 - .08 * Math.sin(clamp((k - 1) / .25) * Math.PI) - .08 * Math.sin(clamp((k - 1.4) / .25) * Math.PI)})`;
      const a = back((k - 1.7) / .4); warn.style.opacity = clamp(a); warn.style.transform = `translateX(${k > 1.7 && k < 2.4 ? Math.sin(k * 50) * 9 : 0}px) scale(${.8 + .2 * a})`;
    };
  }
  return (k, dur) => {
    const a = back(k / .5);
    card.style.transform = `perspective(1600px) translateY(${(1 - a) * 200}px) rotateY(${-6 + out(k / dur) * 8}deg) rotateX(${(1 - a) * 12}deg)`; card.style.opacity = clamp(k / .2);
    g1.style.transform = `translate(${Math.sin(k * .8) * 14}px,${(1 - out(k / .7)) * 140}px) rotate(${-4 + k * .5}deg)`;
    g2.style.transform = `translate(${-Math.sin(k * .7) * 18}px,${(1 - out(k / .9)) * 100}px) rotate(${5 - k * .6}deg)`;
    anim(k, dur);
  };
}
function buildDock(n, shot) {
  const w = $('dockwrap'); w.replaceChildren(); dock = null;
  if (shot === 'hook' || shot === 'cta') return;
  const box = el(w, 'dock');
  const name = document.createElement('b'); name.textContent = 'Vee · VAgent'; const num = document.createElement('small'); num.textContent = `${n + 1} / ${D.scenes.length}`; box.append(name, num);
  dock = { box, bars: Array.from({ length: 22 }, (_, i) => { const b = document.createElement('i'); b.style.left = 38 + i * 25 + 'px'; box.append(b); return b; }) };
}
// mouth shape from the letter being spoken inside the current word
function viseme(s, t) {
  let j = -1; for (let i = 0; i < s.words.length; i++) if (t >= s.words[i].t) j = i;
  if (j < 0) return 'x';

  return 'a' === c ? 'a' : 'eiy'.includes(c) ? 'e' : c === 'o' ? 'o' : 'uwq'.includes(c) ? 'u' : 'mbp'.includes(c) ? 'm' : 'fv'.includes(c) ? 'f' : 'x';
}
let animate;
// for the QA timeline: where the headline sits on a frame, and its font size
function headline(i) {
  seek(i);
  const r = [...$('title').children].map((b) => b.getBoundingClientRect()), x = Math.min(...r.map((a) => a.left)) - 12, y = Math.min(...r.map((a) => a.top)) - 8;
  return { box: [Math.floor(x), Math.floor(y), Math.ceil(Math.max(...r.map((a) => a.right)) + 12 - x), Math.ceil(Math.max(...r.map((a) => a.bottom)) + 8 - y)], px: parseFloat($('title').style.fontSize) };
}
function seek(i) {
  const t = i / D.fps;
  let n = D.scenes.length - 1; while (n > 0 && t < D.scenes[n].start) n--;
  const s = D.scenes[n], k = t - s.start, shot = s.shot || 'phone', level = D.level[i] || 0, lastScene = n === D.scenes.length - 1;
  if (n !== built) {
    built = n; animate = build(n); buildDock(n, shot);
    $('eyebrow').firstChild.textContent = LABEL[shot];
    const title = $('title'); title.replaceChildren(...s.title.split(' ').map((x) => { const b = document.createElement('b'), c = document.createElement('i'); c.textContent = x; b.append(c); return b; }));
    let size = shot === 'hook' ? 108 : 90; title.style.fontSize = size + 'px'; while (size > (shot === 'hook' ? 84 : 56) && (title.scrollHeight > 186 || title.scrollWidth > 940)) title.style.fontSize = (size -= 4) + 'px';
  }
  animate(k, s.dur);
  const first = n === 0, leave = lastScene ? 0 : Math.pow(clamp((k - s.dur + .2) / .2), 2);

  const p = clamp(k / s.dur), dir = n % 2 ? -1 : 1, punch = first ? 0 : 1 - out(k / .5);
  const zoom = (shot === 'hook' ? 1 + p * .09 : shot === 'cta' ? 1.05 - p * .04 : 1 + (n % 3 === 2 ? .05 - p * .04 : p * .045)) + punch * .07 + leave * .05;
  $('cam').style.transform = `translate(${dir * (p - .5) * 22 - dir * leave * 70}px,${(p - .5) * -12}px) scale(${zoom})`;
  $('ui').style.opacity = 1 - leave;
  $('b1').style.transform = `translate(${-300 + Math.sin(t * .35) * 220}px,${100 + Math.cos(t * .28) * 260}px)`;
  $('b2').style.transform = `translate(${380 + Math.cos(t * .4) * 240}px,${900 + Math.sin(t * .31) * 230}px)`;
  $('grid').style.transform = `translate(${(t * 7) % 60}px,${(t * 11) % 60}px)`;
  tiles.forEach(({ n: tile, z }, j) => tile.style.transform = `translate(${Math.sin(t * .22 * z + j) * 36 * z - dir * punch * 120 * z}px,${Math.cos(t * .27 + j * 2) * 30 * z - t * 3 * z}px) rotate(${(j % 2 ? 1 : -1) * (9 + Math.sin(t * .3 + j) * 4)}deg)`);
  const g = GIRL[shot], prev = GIRL[(D.scenes[n - 1] || s).shot || 'phone'], m = out(k / .5), arc = Math.hypot(g[0] - prev[0], g[1] - prev[1]) > 40 ? Math.sin(clamp(k / .5) * Math.PI) * -60 : 0;
  $('girl').style.transform = `translate(${prev[0] + (g[0] - prev[0]) * m}px,${prev[1] + (g[1] - prev[1]) * m + arc}px) scale(${prev[2] + (g[2] - prev[2]) * m})`;
  const talking = k < s.voice, face = shot === 'approve' && k > s.dur * .68 ? 'joy' : shot === 'hook' && k > 1.4 ? 'worried' : g[4];
  draw({ t, pose: g[3], from: prev[3], k: clamp(k / .45), face, level: talking ? level : 0, vis: viseme(s, t), since: first ? 9 : k });
  if (dock) {
    const a = back((k - .25) / .45); dock.box.style.opacity = clamp((k - .25) / .2) * (1 - leave); dock.box.style.transform = `translateX(${(1 - a) * 140}px)`;
    dock.bars.forEach((b, j) => b.style.transform = `scaleY(${.14 + (talking ? level : 0) * (.4 + .6 * Math.abs(Math.sin(j * 1.7 + t * 9))) * (.55 + .45 * Math.sin(j / 21 * Math.PI))})`);
  }
  const lk = $('lockup'); lk.style.display = shot === 'cta' ? 'block' : 'none'; lk.style.opacity = out((k - .2) / .4);
  // headline: words rise out of a mask one after another (the opening frame is already readable)
  [...$('title').children].forEach((b, j) => { const a = first ? 1 : out((k - .08 - j * .07) / .38); b.firstChild.style.transform = `translateY(${(1 - a) * 115}%)`; });
  $('title').style.opacity = 1 - leave; $('title').style.transform = `translateY(${-leave * 30}px)`;
  const eb = first ? 1 : out(k / .35); $('eyebrow').style.opacity = eb * (1 - leave); $('eyebrow').style.transform = `translateY(${(1 - eb) * -24}px)`;
  // captions: short groups in a fixed box, the spoken word is highlighted without moving its neighbours
  const w = s.words, now = Math.max(0, w.findLastIndex((x) => t >= x.t)), group = s.groups.find((r) => now >= r[0] && now <= r[1]), cap = $('cap');
  const key = n + ':' + group[0];

}
