<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Call</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0B0D12">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/vx.css">
  <link rel="stylesheet" href="/assets/call.css">
</head>
<body>
  <!--
    PUBLIC CALL PAGE:  /call.html?id=<business id>   (no login)

    EMBEDDING IN ANOTHER WEBSITE (an <iframe>) — the iframe MUST carry allow="microphone", otherwise the browser
    silently blocks the microphone and the call button will not work:

      <iframe src="https://city.vagent.online/call.html?id=BUSINESS_ID" allow="microphone"
              style="border:0;width:100%;max-width:420px;height:520px" title="Call us"></iframe>

    The page talks only to /api/public-business, /api/public-voice and /api/public-tts (same origin as this page),
    which check the request origin and rate-limit per visitor.
  -->
  <main class="call" id="call">
    <div class="call-grid" aria-hidden="true"></div><div class="call-glow" aria-hidden="true"></div>
    <header class="call-top vx-in" style="--d:0">
      <span class="call-brand" translate="no"><span class="call-mark" aria-hidden="true"><img src="/assets/brand/mark-dark.svg" width="26" height="26" alt=""></span>Voice AI + POS</span>
      <span class="vx-chip call-chip" id="avail" hidden><i class="vx-dot"></i><span id="avail-t">Online</span></span>
    </header>
    <h1 id="title" class="vx-in" style="--d:1">Call</h1>
    <p class="sub vx-in" id="sub" style="--d:2">It answers in Lebanese Arabic or English.</p>
    <div id="mount" class="vx-in" style="--d:3"></div>
    <p class="note" id="note" role="status"></p>
    <p class="fine vx-in" style="--d:4">Your voice is sent to an AI assistant to answer you. Powered by VAgent.</p>
  </main>
  <script src="/assets/voice-agent.js"></script>
  <script>
    (function () {
      // Embedding reminder (also see the comment above): the parent page must set allow="microphone" on the iframe.
      // Which business? ?id=<slug> (city.vagent.online/call.html), the first path segment (voice.vagent.online/<slug>), or the client's own subdomain (voice1.vagent.online -> looked up by host).
      var host = location.hostname.toLowerCase(), id = new URLSearchParams(location.search).get('id') || '';
      if (!id && host === 'voice.vagent.online') id = location.pathname.split('/')[1] || '';
      var byHost = !id && /\.vagent\.online$/.test(host) && !/^(www|voice|adminvoice)\./.test(host);
      var title = document.getElementById('title'), note = document.getElementById('note'), mount = document.getElementById('mount');
      var embedded = window.top !== window.self;
      function stop(msg) { title.textContent = 'Not available'; document.getElementById('sub').textContent = msg; }
      if (byHost ? false : !/^[a-z0-9-]{1,40}$/i.test(id)) return stop('This call link is not valid.');
      fetch('/api/public-business?' + (byHost ? 'host=' + encodeURIComponent(host) : 'id=' + encodeURIComponent(id))).then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); }).then(function (b) {
        title.textContent = 'Call ' + b.name;
        document.title = 'Call ' + b.name;
        var avail = document.getElementById('avail'), at = document.getElementById('avail-t'); avail.hidden = false;
        if (b.active === false) { // owner switched this agent off: no microphone, no call
          document.getElementById('sub').textContent = 'This voice agent is currently offline.';
          avail.className = 'vx-chip call-chip off'; at.textContent = 'Offline';
          mount.innerHTML = '<div class="va" data-v="offline"><div class="va-stage" style="opacity:.5;filter:grayscale(.6)"><span class="va-char" style="display:block;animation:none"><img class="f on" src="/assets/char/r6-idle.svg" alt="" width="240" height="240"></span></div><p class="va-state" role="status">Offline</p></div>';
          return;
        }
        avail.className = 'vx-chip call-chip ok'; at.textContent = 'Online';
        VoiceAgent.mount(mount, b.id, { public: true, onLang: function (l, t) { document.getElementById('sub').textContent = t.sub; document.getElementById('sub').dir = l === 'ar' ? 'rtl' : 'ltr'; } });
        if (embedded && navigator.permissions && navigator.permissions.query) {
          navigator.permissions.query({ name: 'microphone' }).then(function (p) {
            if (p.state === 'denied') note.textContent = 'The microphone is blocked here. If this page is inside another website, that site must embed it with allow="microphone".';
          }).catch(function () {});
        }
      }).catch(function (e) { stop(e === 404 ? 'We could not find this business.' : 'Please try again in a moment.'); });
    })();
  </script>
</body>
</html>
