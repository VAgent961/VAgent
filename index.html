<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VAgent · Sign in</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="theme-color" content="#F3F1EA">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;overflow:hidden;background:#F3F1EA}
    body{font-family:Inter,system-ui,-apple-system,sans-serif;color:#141413}
    a{color:#9A4527}a:hover{color:#6E2F19}

    .root{height:100vh;height:100dvh;overflow:hidden;padding:clamp(16px,4vw,48px);display:flex;align-items:center;justify-content:center}
    .card{width:100%;max-width:980px;max-height:100%;display:flex;flex-direction:row;background:#FAF9F5;border:1px solid #E3E0D5;border-radius:24px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(20,20,19,.25)}

    .art{flex:1 1 0;min-width:0;min-height:0;background:#141413;padding:40px 32px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
    .art svg{width:100%;max-width:380px;height:auto;max-height:52vh}
    .art p{margin:0;max-width:300px;text-align:center;font-family:Newsreader,Georgia,serif;font-size:24px;line-height:1.3;color:#FAF9F5}

    .form{flex:1 1 0;min-width:0;min-height:0;padding:clamp(32px,5vw,56px);display:flex;flex-direction:column;justify-content:center;gap:28px}
    .intro{display:flex;flex-direction:column;gap:10px}
    .intro h1{margin:0;font-family:Newsreader,Georgia,serif;font-weight:400;font-size:40px;line-height:1.1;letter-spacing:-.01em}
    .intro p{margin:0;font-size:15px;line-height:1.55;color:#5E5D59}

    form{display:flex;flex-direction:column;gap:18px}
    .field{display:flex;flex-direction:column;gap:8px}
    .field label{font-size:14px;font-weight:500}
    .row{display:flex;justify-content:space-between;align-items:baseline}
    .row a{font-size:13px}
    .input{width:100%;height:48px;padding:0 14px;border:1px solid #D8D5CB;border-radius:10px;background:#fff;font:inherit;font-size:15px;color:#141413}
    .input::placeholder{color:#8A8880}
    .input:focus{outline:none;border-color:#141413;box-shadow:0 0 0 3px rgba(181,83,47,.18)}
    .pw{position:relative}
    .pw .input{padding-right:52px}
    .eye{position:absolute;right:2px;top:2px;width:44px;height:44px;border:0;background:transparent;border-radius:8px;cursor:pointer;color:#5E5D59;display:flex;align-items:center;justify-content:center}
    .remember{display:flex;align-items:center;gap:10px;font-size:14px;color:#3D3D3A;min-height:44px;cursor:pointer}
    .remember input{width:18px;height:18px;accent-color:#B5532F;margin:0}
    .submit{height:52px;border:0;border-radius:10px;background:#B5532F;color:#fff;font:inherit;font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .15s}
    .submit:hover{background:#9A4527}
    .submit[disabled]{opacity:.7;cursor:wait}
    .msg{margin:0;font-size:13px;line-height:1.4;color:#A1301B}
    .msg:empty{display:none}
    button:focus-visible,a:focus-visible{outline:2px solid #B5532F;outline-offset:2px}

    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes bob2{0%,100%{transform:translateY(-4px)}50%{transform:translateY(3px)}}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
    @keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}
    @keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
    .c-a{animation:bob 3.2s ease-in-out infinite;transform-box:fill-box}
    .c-b{animation:bob2 2.8s ease-in-out infinite;transform-box:fill-box}
    .eye-blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
    .arm{animation:wave 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:10% 90%}
    .glow{animation:glow 1.8s ease-in-out infinite}

    @media (max-width:760px) and (orientation:portrait){
      .root{padding:12px}
      .card{flex-direction:column;height:100%;border-radius:20px}
      .art{flex:0 0 auto;padding:18px 20px 14px;gap:8px}
      .art svg{max-height:24vh;max-height:24dvh}
      .art p{font-size:17px}
      .form{flex:1 1 auto;padding:20px 22px;gap:16px}
      .intro h1{font-size:30px}
      form{gap:12px}
      .input{height:44px}
      .eye{top:0}
      .submit{height:48px}
    }
    @media (max-height:640px){.intro p{display:none}.art svg{max-height:20vh}}
    @media (max-height:500px) and (orientation:landscape){
      .root{padding:10px}
      .card{height:100%;border-radius:18px}
      .art{padding:12px 16px;gap:6px}
      .art svg{max-height:62vh;max-height:62dvh}
      .art p{display:none}
      .form{padding:14px 22px;gap:10px}
      .intro h1{font-size:24px}
      form{gap:8px}
      .field{gap:4px}
      .input{height:38px}
      .eye{width:38px;height:38px;top:0}
      .remember{min-height:30px}
      .submit{height:42px}
    }
    @media (prefers-reduced-motion:reduce){.c-a,.c-b,.eye-blink,.arm,.glow{animation:none}}
  </style>
</head>
<body>
  <div class="root">
    <div class="card">
      <div class="art">
        <svg role="img" aria-label="A friendly assistant and a small robot agent waving hello" viewBox="0 0 400 300">
          <ellipse cx="200" cy="270" rx="150" ry="12" fill="#232320"/>
          <g class="c-a">
            <path d="M70 250 C70 170 100 120 150 120 C200 120 230 170 230 250 Z" fill="#B5532F"/>
            <path d="M92 250 C95 190 118 150 150 150" fill="none" stroke="#C9714F" stroke-width="6" stroke-linecap="round"/>
            <g class="eye-blink"><circle cx="128" cy="180" r="9" fill="#FAF9F5"/><circle cx="130" cy="181" r="4.5" fill="#141413"/></g>
            <g class="eye-blink"><circle cx="168" cy="180" r="9" fill="#FAF9F5"/><circle cx="170" cy="181" r="4.5" fill="#141413"/></g>
            <path d="M136 204 Q150 216 164 204" fill="none" stroke="#141413" stroke-width="4" stroke-linecap="round"/>
            <circle cx="114" cy="200" r="6" fill="#D98A6A"/><circle cx="184" cy="200" r="6" fill="#D98A6A"/>
          </g>
          <g class="c-b">
            <line x1="292" y1="118" x2="292" y2="96" stroke="#B0AEA5" stroke-width="4" stroke-linecap="round"/>
            <circle class="glow" cx="292" cy="90" r="7" fill="#E7B38F"/>
            <rect x="252" y="118" width="80" height="64" rx="18" fill="#E8E6DC"/>
            <rect x="264" y="132" width="56" height="34" rx="10" fill="#141413"/>
            <g class="eye-blink"><rect x="277" y="142" width="9" height="12" rx="4" fill="#8FC79D"/></g>
            <g class="eye-blink"><rect x="298" y="142" width="9" height="12" rx="4" fill="#8FC79D"/></g>
            <rect x="258" y="188" width="68" height="58" rx="16" fill="#D6D4CC"/>
            <rect x="278" y="202" width="28" height="18" rx="5" fill="#B5532F"/>
            <g class="arm"><rect x="326" y="168" width="14" height="46" rx="7" fill="#D6D4CC" transform="rotate(-35 333 214)"/></g>
            <rect x="244" y="196" width="14" height="40" rx="7" fill="#D6D4CC"/>
            <rect x="268" y="246" width="16" height="18" rx="6" fill="#B0AEA5"/>
            <rect x="300" y="246" width="16" height="18" rx="6" fill="#B0AEA5"/>
          </g>
          <rect x="190" y="40" width="88" height="40" rx="14" fill="#FAF9F5"/>
          <path d="M222 80 L216 94 L236 80 Z" fill="#FAF9F5"/>
          <circle cx="216" cy="60" r="5" fill="#B5532F"/><circle cx="234" cy="60" r="5" fill="#B5532F"/><circle cx="252" cy="60" r="5" fill="#B5532F"/>
        </svg>
        <p>Your agents are ready when you are.</p>
      </div>

      <main class="form">
        <div class="intro">
          <h1>Sign in</h1>
          <p>Owners only. Enter your email and password to open the office.</p>
        </div>
        <form id="login" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input class="input" id="email" name="email" type="email" autocomplete="username" placeholder="you@example.com" required>
          </div>
          <div class="field">
            <div class="row">
              <label for="password">Password</label>
              <a href="#forgot">Forgot password?</a>
            </div>
            <div class="pw">
              <input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required>
              <button class="eye" type="button" id="eye" aria-label="Show password">
                <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <label class="remember"><input type="checkbox" name="remember"> Keep me signed in</label>
          <p class="msg" id="msg" role="alert" aria-live="polite"></p>
          <button class="submit" type="submit" id="go">
            Enter the office
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </form>
      </main>
    </div>
  </div>
  <script>
    const pw = document.getElementById('password'), eye = document.getElementById('eye');
    eye.addEventListener('click', () => {
      const show = pw.type === 'password';
      pw.type = show ? 'text' : 'password';
      eye.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });
    const form = document.getElementById('login'), msg = document.getElementById('msg'), go = document.getElementById('go');
    form.addEventListener('submit', async (e) => {
      e.preventDefault(); msg.textContent = '';
      const email = form.email.value.trim(), password = form.password.value;
      if (!email || !password) { msg.textContent = 'Enter your email and password.'; return; }
      go.disabled = true;
      try {
        const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password, remember: form.remember.checked }) });
        const d = await r.json().catch(() => ({}));
        if (r.ok && d.ok) { location.href = d.next || '/office'; return; }
        msg.textContent = d.error || 'Something went wrong. Try again.';
      } catch { msg.textContent = 'No connection. Check your internet and try again.'; }
      go.disabled = false;
    });
  </script>
</body>
</html>
